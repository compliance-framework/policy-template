name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please

jobs:
  release-please:
    # A template never releases itself; repos created from it do.
    if: ${{ !github.event.repository.is_template }}
    uses: compliance-framework/workflows/.github/workflows/release-please.yml@6e7fc9c04b59c7d1117938da397f8a6f8df036ab # v1.5.2
    permissions:
      contents: read
    secrets: inherit
